# Comprueba que lo que se sube compila, y que el gestor de ventanas sigue
# comportándose. Se prueba eso y no el resto a propósito: es la pieza con más
# estado del proyecto y de donde han salido los fallos que llegaron a producción.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: compila el escritorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  ventanas:
    name: prueba el gestor de ventanas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Sólo Chromium: el sitio no depende del motor y bajar los tres tarda.
      # La versión va clavada a la de playwright-core en package.json: cada una
      # espera una revisión concreta del navegador y, si no casan, no lo encuentra.
      - run: npx --yes playwright@1.63.0 install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  backend:
    name: revisa el servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # sin base de datos no se puede arrancar, pero sí comprobar que todo
      # parsea y que no falta ningún import
      - name: sintaxis e imports
        working-directory: backend
        run: |
          for f in $(find src scripts -name '*.js'); do node --check "$f"; done
          node -e "import('./src/lib/images.js'), import('./src/lib/storage.js'), import('./src/db/schema.js')"

  docker:
    name: construye la imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
