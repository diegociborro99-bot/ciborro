<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>degos space</title>
    <meta name="description" content="degos space — fotos y cosas que construyo, en forma de escritorio." />

    <!-- el gato del sitio, sentado en el ámbar del acento -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- el oscuro de :root, que es con lo que se pinta antes de que monte React.
         A partir de ahí lo mantiene al día el efecto de tema de App.jsx. -->
    <meta name="theme-color" content="#100f0d" />

    <!-- cómo se ve al compartir el enlace -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="degos space" />
    <meta property="og:description" content="Fotos y cosas que construyo, en forma de escritorio." />
    <meta property="og:image" content="./icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap"
      rel="stylesheet"
    />

    <!-- El tema, antes de la primera pintada. Si esto llega tarde, el tema claro
         arranca en negro: los tokens de :root son los oscuros y el telón de
         arranque es lo primero que se pinta. La expresión tiene que ser la misma
         que la de App.jsx; si divergen, vuelve el destello. -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
